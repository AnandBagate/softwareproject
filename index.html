<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b18">
  <meta name="description" content="A little hello from a very big universe.">
  <title>Hello, World ✦</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { color-scheme: dark; --ink: #f7f6ff; --muted: #aaa9c3; --violet: #a78bfa; --pink: #f4a8dc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; overflow: hidden; color: var(--ink); font-family: Manrope, ui-sans-serif, system-ui, sans-serif; background: #090b18; }
    .scene { position: relative; display: grid; min-height: 100svh; place-items: center; isolation: isolate; overflow: hidden; padding: 32px 22px; background: radial-gradient(ellipse at 50% 45%, #252344 0%, #121426 38%, #090b18 76%); }
    .scene::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .23; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 56px 56px; mask-image: linear-gradient(transparent, black 22%, black 78%, transparent); }
    .glow { position: absolute; z-index: -1; width: min(64vw, 720px); aspect-ratio: 1; border-radius: 50%; background: #8763e8; filter: blur(150px); opacity: .14; animation: breathe 8s ease-in-out infinite alternate; }
    .star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: white; box-shadow: 0 0 10px 2px #fff9; animation: twinkle 3s ease-in-out infinite alternate; }
    .star:nth-child(2) { top: 19%; left: 18%; animation-delay: .8s; }.star:nth-child(3) { top: 26%; right: 22%; animation-delay: 1.7s; }.star:nth-child(4) { bottom: 21%; left: 27%; animation-delay: 1.1s; }.star:nth-child(5) { bottom: 29%; right: 16%; animation-delay: .3s; }.star:nth-child(6) { top: 66%; right: 31%; animation-delay: 2s; }
    .site-header { position: absolute; top: 0; left: 0; right: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 28px clamp(22px, 6vw, 84px); }
    .brand { color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 800; letter-spacing: -.05em; }
    .brand-mark { margin-right: 7px; color: #d4bdff; }
    .brand-light { color: #aaa9c3; font-weight: 500; }
    .site-nav { display: flex; align-items: center; gap: 8px; }
    .site-nav a { padding: 9px 13px; border: 1px solid transparent; border-radius: 999px; color: #aaa9c3; text-decoration: none; font-size: 12px; font-weight: 600; transition: color .2s, background .2s, border-color .2s; }
    .site-nav a:hover, .site-nav a.active { color: #f7f6ff; background: #ffffff0a; border-color: #ffffff16; }
    .card { width: min(100%, 760px); text-align: center; animation: arrive .9s cubic-bezier(.2,.75,.25,1) both; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 29px; padding: 9px 14px; border: 1px solid #ffffff20; border-radius: 999px; background: #ffffff08; color: #d3cde9; font: 500 10px/1 'DM Mono', monospace; letter-spacing: .14em; text-transform: uppercase; }
    .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: #a9f4d0; box-shadow: 0 0 12px #a9f4d0; }
    h1 { margin: 0; font-size: clamp(3.7rem, 12vw, 8.2rem); font-weight: 800; letter-spacing: -.085em; line-height: .96; }
    h1 span { display: block; color: transparent; background: linear-gradient(100deg, #c5b4ff 5%, #f3b9e3 54%, #ffd6a6 95%); background-clip: text; -webkit-background-clip: text; filter: drop-shadow(0 8px 40px #bf9bff35); }
    .sparkle { display: inline-block; margin-left: .02em; color: #ffe3a9; font-size: .57em; vertical-align: top; transform: translateY(.13em); animation: twinkle 2s ease-in-out infinite alternate; }
    .subtitle { max-width: 430px; margin: 28px auto 0; color: var(--muted); font-size: clamp(14px, 2.4vw, 17px); line-height: 1.8; }
    .actions { display: flex; justify-content: center; align-items: center; gap: 13px; margin-top: 34px; }
    button { appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 0 20px; border: 1px solid #ffffff22; border-radius: 999px; color: var(--ink); background: #ffffff0a; font: 700 13px Manrope, sans-serif; cursor: pointer; transition: transform .2s, background .2s, border-color .2s, box-shadow .2s; }
    button:hover { transform: translateY(-2px); border-color: #ffffff50; background: #ffffff12; }
    button:focus-visible { outline: 2px solid #d8c8ff; outline-offset: 4px; }
    .primary { border-color: transparent; color: #171225; background: linear-gradient(105deg, #d2c1ff, #f6c7e4 65%, #ffdfb3); box-shadow: 0 8px 28px #c59ff22b; }
    .primary:hover { border-color: transparent; background: linear-gradient(105deg, #e1d6ff, #f9d5ea 65%, #ffe9cb); box-shadow: 0 10px 36px #c59ff244; }
    .arrow { font-size: 16px; transition: transform .2s; }.primary:hover .arrow { transform: translateX(3px); }
    .signature { margin-top: 69px; color: #77768f; font: 10px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; }
    .signature span { color: #aaa0cb; }
    .toast { position: fixed; left: 50%; bottom: 28px; z-index: 2; transform: translate(-50%, 12px); padding: 12px 16px; border: 1px solid #ffffff20; border-radius: 12px; background: #191a2df2; color: #eae7f6; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; box-shadow: 0 10px 40px #0005; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }
    @keyframes arrive { from { opacity: 0; transform: translateY(20px) scale(.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes breathe { from { transform: scale(.9); opacity: .11; } to { transform: scale(1.1); opacity: .2; } }
    @keyframes twinkle { from { opacity: .35; transform: scale(.75); } to { opacity: 1; transform: scale(1.15); } }
    @media (max-width: 520px) { .site-header { padding: 19px 16px; } .site-nav { gap: 1px; } .site-nav a { padding: 8px 9px; font-size: 11px; } .eyebrow { margin-bottom: 24px; } .subtitle { margin-top: 22px; } .actions { flex-direction: column; margin-top: 27px; } button { width: min(100%, 245px); } .signature { margin-top: 48px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="scene">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Hello World home"><span class="brand-mark">✦</span> hello<span class="brand-light">world</span></a>
      <nav class="site-nav" aria-label="Main navigation">
        <a class="active" href="index.html" aria-current="page">Home</a>
        <a href="about.html">About</a>
      <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>
    <div class="glow" aria-hidden="true"></div>
    <i class="star" aria-hidden="true"></i><i class="star" aria-hidden="true"></i><i class="star" aria-hidden="true"></i><i class="star" aria-hidden="true"></i><i class="star" aria-hidden="true"></i>
    <section class="card" aria-labelledby="title">
      <div class="eyebrow"><i aria-hidden="true"></i> A tiny beginning</div>
      <h1 id="title">BYE<span>World<span class="sparkle" aria-hidden="true">✦</span></span></h1>
      <p class="subtitle">One small page, one giant universe of possibility.<br>Glad you’re here.</p>
      <div class="actions">
        <button class="primary" id="helloButton">Say hello <span class="arrow" aria-hidden="true">↗</span></button>
        <button id="copyButton">Copy the magic <span aria-hidden="true">✧</span></button>
      </div>
      <div class="signature">Made with <span>curiosity</span> &amp; a little bit of CSS</div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script>
    const toast = document.querySelector('#toast');
    let toastTimer;
    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }
    document.querySelector('#helloButton').addEventListener('click', () => showToast('Hello right back at you ✨'));
    document.querySelector('#copyButton').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText('Hello, World! ✦');
        showToast('Copied a little hello to your clipboard.');
      } catch {
        showToast('Hello, World! ✦');
      }
    });
  </script>
</body>
</html>
