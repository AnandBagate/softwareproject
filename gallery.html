<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b18">
  <meta name="description" content="A little collection of color, light, and imagination.">
  <title>Gallery — Hello World</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
    :root { color-scheme: dark; --ink: #f7f6ff; --muted: #aaa9c3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; color: var(--ink); font-family: Manrope, ui-sans-serif, system-ui, sans-serif; background: radial-gradient(ellipse at 50% 20%, #252344 0%, #121426 42%, #090b18 85%); }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .2; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 56px 56px; mask-image: linear-gradient(transparent, black 22%, black 78%, transparent); }
    .site-header { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: 28px clamp(22px, 6vw, 84px); }
    .brand { color: var(--ink); text-decoration: none; font-size: 15px; font-weight: 800; letter-spacing: -.05em; } .brand-mark { margin-right: 7px; color: #d4bdff; } .brand-light { color: #aaa9c3; font-weight: 500; }
    .site-nav { display: flex; align-items: center; gap: 8px; } .site-nav a { padding: 9px 13px; border: 1px solid transparent; border-radius: 999px; color: #aaa9c3; text-decoration: none; font-size: 12px; font-weight: 600; transition: color .2s, background .2s, border-color .2s; }
    .site-nav a:hover, .site-nav a.active { color: #f7f6ff; background: #ffffff0a; border-color: #ffffff16; } .site-nav a:focus-visible, .brand:focus-visible { outline: 2px solid #d8c8ff; outline-offset: 4px; }
    main { position: relative; z-index: 0; width: min(100%, 1100px); margin: 0 auto; padding: 45px 30px 70px; }
    .eyebrow { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 22px; padding: 9px 14px; border: 1px solid #ffffff20; border-radius: 999px; background: #ffffff08; color: #d3cde9; font: 500 10px/1 'DM Mono', monospace; letter-spacing: .14em; text-transform: uppercase; } .eyebrow i { width: 7px; height: 7px; border-radius: 50%; background: #a9f4d0; box-shadow: 0 0 12px #a9f4d0; }
    h1 { margin: 0; font-size: clamp(3rem, 8vw, 6rem); font-weight: 800; letter-spacing: -.075em; line-height: 1; } h1 span { color: transparent; background: linear-gradient(100deg, #c5b4ff 5%, #f3b9e3 54%, #ffd6a6 95%); background-clip: text; -webkit-background-clip: text; }
    .intro { max-width: 570px; margin: 20px 0 34px; color: #c8c6d8; font-size: 16px; line-height: 1.8; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #ffffff1b; border-radius: 19px; background: #ffffff08; box-shadow: 0 18px 50px #0002; animation: appear .65s both; }
    figure:nth-child(2) { animation-delay: .1s; } figure:nth-child(3) { animation-delay: .2s; }
    .art { position: relative; display: grid; min-height: 245px; overflow: hidden; place-items: center; isolation: isolate; }
    .art::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(transparent 50%, #0b0b19aa); }
    .nebula { background: radial-gradient(ellipse at 48% 48%, #ffc6eb 0 2%, transparent 3%), radial-gradient(ellipse at 40% 58%, #cc80ff 0, transparent 25%), radial-gradient(ellipse at 62% 42%, #ffadcf 0, transparent 22%), radial-gradient(ellipse at 50% 50%, #39316e, #101324 70%); }
    .nebula::before { content: ""; width: 104px; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, #f5b8ee 14%, #9566db 47%, #171833 72%); box-shadow: 0 0 50px #e2aaffaa, 0 0 110px #ba7cf855; }
    .sunrise { background: linear-gradient(180deg, #22234d 0%, #86578f 45%, #f1a989 66%, #343254 67%, #16182e 100%); }
    .sunrise::before { content: ""; position: absolute; top: 33%; width: 110px; aspect-ratio: 1; border-radius: 50%; background: linear-gradient(135deg, #ffe9bc, #f9acbd 70%); box-shadow: 0 0 65px #ffb9bcaa; }
    .sunrise::after { z-index: 0; background: repeating-linear-gradient(180deg, transparent 0 9px, #282441 10px 13px); mask-image: linear-gradient(180deg, transparent 44%, black 64%); }
    .aurora { background: radial-gradient(ellipse at 50% 120%, #253c55, transparent 60%), linear-gradient(155deg, #101729, #161735 54%, #192c42); }
    .aurora::before { content: ""; position: absolute; inset: -20% -10%; background: repeating-linear-gradient(108deg, transparent 0 60px, #86ffda1c 72px, #b18bff55 100px, #8bffff1b 130px, transparent 170px); filter: blur(14px); transform: rotate(-12deg); }
    figcaption { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 17px 18px; } figcaption strong { font-size: 13px; font-weight: 700; } figcaption small { color: #8e8da8; font: 10px 'DM Mono', monospace; letter-spacing: .08em; text-transform: uppercase; }
    .footer { margin-top: 33px; color: #77768f; font: 10px 'DM Mono', monospace; letter-spacing: .12em; text-transform: uppercase; } .footer span { color: #aaa0cb; }
    @keyframes appear { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 720px) { .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); } .art { min-height: 215px; } }
    @media (max-width: 520px) { .site-header { padding: 19px 16px; } .site-nav { gap: 1px; } .site-nav a { padding: 8px 8px; font-size: 10px; } main { padding: 38px 20px 55px; } .gallery { grid-template-columns: 1fr; } .art { min-height: 250px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="Hello World home"><span class="brand-mark">✦</span> hello<span class="brand-light">world</span></a>
    <nav class="site-nav" aria-label="Main navigation">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="gallery.html" aria-current="page" class="active">Gallery</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>
  <main>
    <div class="eyebrow"><i aria-hidden="true"></i> Little windows into wonder</div>
    <h1>A gallery of <span>possibility.</span></h1>
    <p class="intro">A few imagined worlds made from color and light. Take a moment, look around, and let your mind wander.</p>
    <section class="gallery" aria-label="Gallery artwork">
      <figure><div class="art nebula" role="img" aria-label="Glowing violet and pink nebula"></div><figcaption><strong>Somewhere, among the stars</strong><small>01 / Cosmos</small></figcaption></figure>
      <figure><div class="art sunrise" role="img" aria-label="Peach colored sun setting over a dreamy horizon"></div><figcaption><strong>The first light</strong><small>02 / Horizon</small></figcaption></figure>
      <figure><div class="art aurora" role="img" aria-label="Soft ribbons of green and violet northern lights"></div><figcaption><strong>Quiet northern skies</strong><small>03 / Atmosphere</small></figcaption></figure>
    </section>
    <p class="footer">Made of color. <span>Made to wander.</span></p>
  </main>
</body>
</html>
